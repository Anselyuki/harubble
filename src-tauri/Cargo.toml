[package]
name = "harubble"
version = "2.2.0"
edition = "2021"
description = "Cross-platform lossless music player and downloader"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "harubble"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
cpal = "0.17"
crossbeam-queue = "0.3"
hound = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.7"
metaflac = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harubble_core = { path = "../crates/harubble-core" }
souvlaki = "0.8"
symphonia = { version = "0.5.5", features = ["flac", "mp3", "wav"] }
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
time = { version = "0.3", features = ["formatting"] }
walkdir = "2"
tempfile = "3"
tantivy = "0.22"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
rusqlite = { version = "0.34", features = ["bundled"] }
rubato = "0.16"
uuid = { version = "1", features = ["v4"] }
fluent-templates = "0.14.0"
unic-langid = "0.9.6"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }
